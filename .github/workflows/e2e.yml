name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Address to test. Empty: the Cloudflare Pages deployment of the commit this run is on.'
        default: ''
        type: string
  schedule:
    - cron: '17 8 * * 1' # off the hour: GitHub delays or drops scheduled runs at :00 under load

jobs:
  # The address to test: the Cloudflare Pages deployment of this commit
  # (<hash>.molviewer.pages.dev; on a schedule run github.sha is main's head,
  # so that is the production build). Not molviewer.bio: its zone WAF
  # challenges cloud runner IPs, which failed every test for an hour in run
  # 43930423486. Not molviewer.pages.dev: it redirects to molviewer.bio.
  target:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read
    outputs:
      base_url: ${{ steps.find.outputs.base_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Find the deployment to test
        id: find
        run: bash scripts/ci/deployment-url.sh
        env:
          SHA: ${{ github.sha }}
          OVERRIDE: ${{ inputs.base_url }}
          GH_TOKEN: ${{ github.token }}

  e2e-tests:
    needs: target
    runs-on: ubuntu-24.04 # Playwright 1.57 cannot install browsers on Ubuntu 26.04 (ubuntu-latest since 2026-10)
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit
        # Usually 1-2 minutes; an apt mirror stall once held it for the whole job timeout
        timeout-minutes: 10

      - name: Run E2E tests (shard ${{ matrix.shard }}/3)
        run: pnpm test:e2e --shard=${{ matrix.shard }}/3
        # Slowest shard seen: 31 min. Above Playwright's globalTimeout (40 min),
        # so Playwright ends a stuck run itself and still writes its blob report.
        timeout-minutes: 45
        env:
          BASE_URL: ${{ needs.target.outputs.base_url }}
          CI: true

      - name: Upload blob report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  merge-reports:
    # Not when target failed: e2e-tests was then skipped and there's nothing to merge.
    if: always() && needs.e2e-tests.result != 'skipped'
    needs: e2e-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      # No blobs when every shard was stopped before Playwright finished: say
      # so here rather than fail a second time with a misleading merge error.
      - name: Merge reports
        id: merge
        run: |
          if ! compgen -G 'all-blob-reports/*.zip' >/dev/null; then
            echo "::notice::No blob reports to merge, see the e2e-tests logs."
            exit 0
          fi
          pnpm exec playwright merge-reports --reporter html ./all-blob-reports
          echo "merged=true" >>"$GITHUB_OUTPUT"

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: steps.merge.outputs.merged == 'true'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
