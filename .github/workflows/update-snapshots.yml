name: Update E2E Snapshots

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to take the snapshots from (a branch preview for PRs that change rendering)'
        default: 'https://molviewer.bio/'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update-snapshots:
    runs-on: ubuntu-24.04 # same image as e2e.yml, so the baselines match the runs that check them
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm exec playwright install --with-deps chromium webkit
        # Usually 1-2 minutes; an apt mirror stall once held it for the whole job timeout
        timeout-minutes: 10

      - name: Generate Linux snapshots
        run: pnpm test:e2e --project=chromium-visual --project=webkit --update-snapshots
        env:
          BASE_URL: ${{ inputs.base_url || 'https://molviewer.bio/' }}
          CI: true

      - name: Create PR with updated snapshots
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore: update Linux e2e snapshots'
          title: 'chore: update Linux e2e snapshots'
          body: Auto-generated Linux baselines from `Update E2E Snapshots` workflow, taken from ${{ inputs.base_url || 'https://molviewer.bio/' }} on `${{ github.ref_name }}`.
          branch: update-e2e-snapshots
          add-paths: e2e-snapshots/
