name: Update E2E Snapshots

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Address to take the snapshots from. Empty: the Cloudflare Pages deployment of the commit this run is on (run it on a PR branch to take that branch''s rendering).'
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  # As in e2e.yml: the Cloudflare Pages deployment of this commit, not
  # molviewer.bio, whose zone WAF challenges cloud runner IPs.
  target:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read
    outputs:
      base_url: ${{ steps.find.outputs.base_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Find the deployment to take the snapshots from
        id: find
        run: bash scripts/ci/deployment-url.sh
        env:
          SHA: ${{ github.sha }}
          OVERRIDE: ${{ inputs.base_url }}
          GH_TOKEN: ${{ github.token }}

  update-snapshots:
    needs: target
    runs-on: ubuntu-24.04 # same image as e2e.yml, so the baselines match the runs that check them
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm exec playwright install --with-deps chromium webkit
        # Usually 1-2 minutes; an apt mirror stall once held it for the whole job timeout
        timeout-minutes: 10

      - name: Generate Linux snapshots
        run: pnpm test:e2e --project=chromium-visual --project=webkit --update-snapshots
        env:
          BASE_URL: ${{ needs.target.outputs.base_url }}
          CI: true

      - name: Create PR with updated snapshots
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore: update Linux e2e snapshots'
          title: 'chore: update Linux e2e snapshots'
          body: Auto-generated Linux baselines from `Update E2E Snapshots` workflow, taken from ${{ needs.target.outputs.base_url }} on `${{ github.ref_name }}`.
          branch: update-e2e-snapshots
          add-paths: e2e-snapshots/
