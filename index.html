<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

         unknown paths; functions/_middleware.ts turns that into a 404. Landing
         pages and generated pages remove it. Keep it on one line. -->
    <meta name="mv-spa-shell" content="fallback">
    <script src="/theme-init.js"></script>
    <script src="/footer.js" defer></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://molviewer.bio/" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1117" />

    <!-- Primary Meta Tags -->
    <meta name="description" content="Free 3D molecule viewer in your browser, no install. Open PDB and mmCIF files, AlphaFold models and small molecules. See helices and sheets, measure distances." />
    <meta name="robots" content="index, follow">
    <title>MolViewer: Free Online 3D Molecule Viewer</title>

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://molviewer.bio/">
    <meta property="og:site_name" content="MolViewer">
    <meta property="og:locale" content="en_US">
    <meta property="og:title" content="MolViewer: Free Online 3D Molecule Viewer">
    <meta property="og:description" content="View proteins, DNA, AlphaFold predictions and small molecules in 3D, free in your browser. Open PDB, mmCIF, SDF and XYZ files, measure and share.">
    <meta property="og:image" content="https://molviewer.bio/og-image.png">
    <meta property="og:image:secure_url" content="https://molviewer.bio/og-image.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="MolViewer: Free Online 3D Molecule Viewer">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="MolViewer: Free Online 3D Molecule Viewer">
    <meta name="twitter:description" content="View proteins, DNA, AlphaFold predictions and small molecules in 3D, free in your browser. Open PDB, mmCIF, SDF and XYZ files, measure and share.">
    <meta name="twitter:image" content="https://molviewer.bio/og-image.png">
    <meta name="twitter:image:alt" content="MolViewer: Free Online 3D Molecule Viewer">

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "MolViewer",
      "alternateName": ["Mol Viewer", "MolViewer Molecule Viewer"],
      "description": "Free, open-source 3D molecule viewer that runs in the browser. Opens PDB and mmCIF files, AlphaFold predictions and PubChem small molecules, with cartoon, ball-and-stick, spacefill and surface representations, secondary-structure coloring, distance/angle/dihedral measurements, sharing and embedding.",
      "applicationCategory": "ScienceApplication",
      "operatingSystem": "Web Browser",
      "browserRequirements": "Requires WebGL 2 support",
      "author": {
        "@type": "Person",
        "name": "Gleb Shulga"
      },
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Load structures by PDB ID from RCSB or by UniProt accession from AlphaFold DB",
        "Open PDB, mmCIF, SDF, MOL and XYZ files",
        "Small molecules from PubChem",
        "Representations: Ball & Stick, Stick, Cartoon, Spacefill, Surface",
        "Color schemes: CPK, Chain, Residue type, Secondary structure, B-factor (pLDDT), Rainbow",
        "Measurement tools: Distance, Angle, Dihedral",
        "Sequence viewer with secondary structure annotation",
        "Multi-structure comparison (up to 10 structures)",
        "Share links and embeddable viewer",
        "PNG, turntable video, GLB and STL export"
      ],
      "url": "https://molviewer.bio",
      "screenshot": "https://molviewer.bio/og-image.png",
      "license": "https://opensource.org/licenses/MIT"
    }
